[project]
name = "magewind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nick Gideo", email = "ngideo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openai]>=2.48.0",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
magewind = "magewind:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
